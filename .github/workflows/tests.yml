name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # Code style
  # -----------------------------------------------------------------------
  pint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install dependencies
        run: |
          composer require laravel/pint --dev --no-interaction
          composer install --no-interaction --prefer-dist
      - name: Run Pint
        run: ./vendor/bin/pint --test src/ tests/

  # -----------------------------------------------------------------------
  # Syntax check — confirms source is valid PHP on versions we can't
  # fully test because Laravel 8/9 (EOL) have security advisories that
  # block composer from installing them in a fresh environment.
  # -----------------------------------------------------------------------
  syntax:
    name: Syntax / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check syntax
        run: find src -name "*.php" -exec php -l {} \;

  # -----------------------------------------------------------------------
  # Full test suite — Laravel 10, 11, 12 (non-EOL, no advisory issues)
  # -----------------------------------------------------------------------
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10 — PHP 8.1, 8.2
          - php: '8.1'
            laravel: '^10.0'
            testbench: '^8.0'
            phpunit: '^10.0'
          - php: '8.2'
            laravel: '^10.0'
            testbench: '^8.0'
            phpunit: '^10.0'

          # Laravel 11 — PHP 8.2, 8.3, 8.4
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.0'
          - php: '8.3'
            laravel: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.0'
          - php: '8.4'
            laravel: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.0'

          # Laravel 12 — PHP 8.2, 8.3, 8.4, 8.5
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
          - php: '8.5'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
            experimental: true

    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          composer require \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}" \
            --dev --no-interaction --no-update
          composer update --no-interaction --prefer-dist

      - name: Run tests
        run: ./vendor/bin/phpunit --testdox
